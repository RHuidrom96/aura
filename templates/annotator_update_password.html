{% extends "base.html" %}
{% block title %}Update password · Aura{% endblock %}

{% block content %}
<section class="card hero-card auth-card">
  <h1>Update password</h1>
  <p class="lede">Changing your password updates it across all campaigns.</p>

  <form method="post" action="{{ url_for('annotator_update_password') }}" class="register-form">
    <div class="field">
      <label for="current_password">Current password <span class="req">*</span></label>
      <input type="password" id="current_password" name="current_password"
             required autocomplete="current-password" autofocus>
    </div>
    <div class="field">
      <label for="new_password">New password <span class="req">*</span></label>
      <input type="password" id="new_password" name="new_password"
             required minlength="6" autocomplete="new-password">
      <p class="hint">At least 6 characters.</p>
    </div>
    <div class="field">
      <label for="confirm_password">Confirm new password <span class="req">*</span></label>
      <input type="password" id="confirm_password" name="confirm_password"
             required minlength="6" autocomplete="new-password">
    </div>
    <div class="form-actions">
      <a href="{{ url_for('annotator_dashboard') }}" class="btn">Cancel</a>
      <button type="submit" class="btn btn-primary">Update password</button>
    </div>
  </form>
</section>
{% endblock %}
