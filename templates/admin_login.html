{% extends "base.html" %}
{% block title %}Admin sign in · Aura{% endblock %}

{% block content %}
<section class="card hero-card auth-card">
  <h1>Admin sign in</h1>
  <p class="lede">Enter the admin credentials configured by your system administrator.</p>

  <form method="post" action="{{ url_for('admin_login_view') }}" class="register-form">
    <div class="field">
      <label for="email">Email <span class="req">*</span></label>
      <input type="email" id="email" name="email" required autocomplete="email" autofocus>
    </div>
    <div class="field">
      <label for="password">Password <span class="req">*</span></label>
      <input type="password" id="password" name="password" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn btn-primary btn-large" style="margin-bottom: 5px; text-align: center; padding: 10px;" > 
      Sign in</button>
      <a href="{{ url_for('admin_forgot_password') }}">
        Forgot password?
    </a>
  </form>

  <form method="get" action="{{ url_for('admin_signup_view') }}" >
    <button type="submit" class="btn btn-primary btn-large" style="margin-top: 5px; text-align: center; padding: 10px;">
        Create an admin account
    </button>
  </form>
</section>
{% endblock %}
