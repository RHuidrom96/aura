{% extends "base.html" %}
{% block title %}Forgot Password · Aura{% endblock %}

{% block content %}
<section class="card hero-card auth-card">

    <h1>Forgot your password?</h1>

    <p class="lede">
        Enter the email address associated with your account.
        We'll send you a one-time verification code (OTP) to reset your password.
    </p>

    <form method="post" action="{{ action_url }}" class="register-form">

        <div class="field">
            <label for="email">
                Email address <span class="req">*</span>
            </label>

            <input
                type="email"
                id="email"
                name="email"
                required
                autocomplete="email"
                placeholder="you@example.com"
                autofocus
            >
        </div>

        <button
            type="submit"
            class="btn btn-primary btn-large btn-block">
            Send verification code
        </button>

        <a
            href="{{ back_url }}"
            class="btn btn-secondary btn-large btn-block">
            Back to sign in
        </a>

    </form>

</section>
{% endblock %}
