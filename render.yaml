services:
  - type: web
    name: aura
    runtime: python
    plan: starter            # 'free' works too; starter keeps it always-on
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers ${WEB_CONCURRENCY:-2} --timeout 180
    envVars:
      - key: MT_EVAL_SECRET_KEY
        generateValue: true
      - key: MT_EVAL_ADMIN_EMAIL
        sync: false
      - key: MT_EVAL_ADMIN_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MT_EVAL_EMAIL_FROM
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: aura-db
          property: connectionString
databases:
  - name: aura-db
    plan: free
